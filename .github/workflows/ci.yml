name: Static map CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check map.js
          node --check map_state.mjs
          node --check reindex.mjs
          node --check tests/map_state.test.mjs
          node --check tests/viewer.test.mjs
          node --check tests/reports_index.test.mjs

      - name: Test static map behavior, viewer rendering, and committed data
        run: node --test tests/map_state.test.mjs tests/viewer.test.mjs

      - name: Check the highlight-reports index is up to date with its report files
        run: node --test tests/reports_index.test.mjs
