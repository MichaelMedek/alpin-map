<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interactive map of current Alpine ski-resort construction and infrastructure news.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
    <title>Alpine construction news</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="./map.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Alpine construction news</h1>
        <p>Recent ski-resort construction and infrastructure progress.</p>
      </div>
      <nav aria-label="Map resources">
        <a href="./map.geojson" target="_blank" rel="noopener noreferrer">GeoJSON source</a>
      </nav>
    </header>
    <main class="map-shell">
      <div id="map" role="region" aria-label="Interactive Alpine news map"></div>
      <p id="map-message" class="map-message" role="status">Loading the latest map…</p>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script type="module" src="./map.js"></script>
  </body>
</html>
