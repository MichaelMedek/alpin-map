<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A daily Alpine ski briefing: resort construction news, snow and mountain conditions, a report of the day, and tips and debates from the forums.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
    <title>Alpine ski briefing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <link rel="stylesheet" href="./map.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__intro">
        <p class="site-header__eyebrow">Alpine ski briefing</p>
        <h1 id="page-title">Resort news</h1>
        <p id="page-subtitle" class="site-header__subtitle">Loading the latest briefing…</p>
        <p id="run-timestamp" class="site-header__runtime" role="status"></p>
      </div>
      <nav class="site-nav" aria-label="Briefing pages">
        <a href="#/resort-news" data-route="resort-news">Resort news</a>
        <a href="#/snow" data-route="snow">Snow &amp; conditions</a>
        <a href="#/report" data-route="report">Report of the day</a>
        <a href="#/tips" data-route="tips">Tips</a>
        <a href="#/debates" data-route="debates">Debates</a>
      </nav>
    </header>
    <main class="view-shell">
      <div id="map" class="map-view" role="region" aria-label="Interactive Alpine briefing map" hidden></div>
      <section id="doc" class="doc-view" aria-label="Briefing content" hidden></section>
      <p id="view-message" class="view-message" role="status" hidden>Loading the latest briefing…</p>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script type="module" src="./map.js"></script>
  </body>
</html>
